<!doctype html>
<!--
  PROTOTYPE UI. Throwaway first slice: draw a note on a tablet canvas, save
  it locally, then trigger a mocked AI interpretation. No real backend, no
  real LLM call -- see docs/prototype-scope.md for the full scope.
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkNote AI Prototype</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1.5rem;
        background: #f5f5f4;
        color: #1c1917;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 1rem;
      }
      #drawing-canvas {
        touch-action: none;
        border: 2px solid #44403c;
        border-radius: 8px;
        background: #fff;
        display: block;
        width: 100%;
        max-width: 800px;
        height: 320px;
      }
      .controls {
        display: flex;
        gap: 0.75rem;
        margin: 1rem 0;
      }
      button {
        font-size: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        border: 1px solid #44403c;
        background: #fff;
        cursor: pointer;
      }
      button:active {
        background: #e7e5e4;
      }
      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        max-width: 800px;
      }
      .panel {
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        padding: 0.75rem;
        background: #fff;
        min-height: 4rem;
      }
      .panel h2 {
        font-size: 0.9rem;
        margin: 0 0 0.5rem;
        color: #57534e;
      }
      #raw-note-preview {
        border: 1px dashed #d6d3d1;
        width: 100%;
        height: 120px;
      }
      #interpreted-entry {
        font-size: 0.95rem;
      }
      .billable-data-fields {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .billable-data-field {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        font-size: 0.85rem;
        color: #57534e;
      }
      .billable-data-field input {
        font: inherit;
        padding: 0.35rem 0.5rem;
        border-radius: 6px;
        border: 1px solid #d6d3d1;
      }
      #document-list li {
        padding: 0.4rem 0.5rem;
        border-bottom: 1px solid #e7e5e4;
        cursor: pointer;
        font-size: 0.85rem;
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
      }
      #document-list li:hover {
        background: #f5f5f4;
      }
      #document-list li[aria-selected="true"] {
        background: #e7e5e4;
        font-weight: 600;
      }
      #document-list .doc-status {
        font-size: 0.75rem;
        color: #78716c;
        text-transform: uppercase;
      }
      #document-list .doc-snippet {
        color: #57534e;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status {
        font-size: 0.85rem;
        color: #78716c;
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <h1>InkNote AI Prototype</h1>

    <details class="panel" style="max-width: 800px; margin-bottom: 1rem">
      <summary style="cursor: pointer; font-size: 0.9rem; color: #57534e">Einstellungen: Provider</summary>
      <div class="controls" style="flex-wrap: wrap; margin-top: 0.75rem">
        <input type="password" id="provider-api-key" placeholder="Gemini API-Key" style="padding: 0.5rem; border-radius: 6px; border: 1px solid #d6d3d1" />
        <input type="text" id="provider-model" placeholder="Modell (z.B. gemini-3.6-flash)" style="padding: 0.5rem; border-radius: 6px; border: 1px solid #d6d3d1" />
        <button id="save-settings-button" type="button">Speichern</button>
      </div>
    </details>

    <div class="panel" style="max-width: 800px; margin-bottom: 1rem">
      <h2>Gespeicherte Notizen</h2>
      <div class="controls" style="margin: 0 0 0.5rem">
        <input type="search" id="document-search" placeholder="Suchen …" style="flex: 1; padding: 0.5rem; border-radius: 6px; border: 1px solid #d6d3d1" />
      </div>
      <div class="controls" id="status-filter" style="margin: 0 0 0.5rem; font-size: 0.85rem; flex-wrap: wrap">
        <label><input type="checkbox" value="scribbled" checked /> scribbled</label>
        <label><input type="checkbox" value="interpreted" checked /> interpreted</label>
        <label><input type="checkbox" value="approved" checked /> approved</label>
        <label><input type="checkbox" value="exported" checked /> exported</label>
      </div>
      <ul id="document-list" style="list-style: none; margin: 0; padding: 0; max-height: 200px; overflow-y: auto"></ul>
    </div>

    <canvas id="drawing-canvas"></canvas>

    <div class="controls">
      <button id="pen-button" type="button" aria-pressed="true">Stift</button>
      <button id="eraser-button" type="button" aria-pressed="false">Radierer</button>
      <button id="undo-button" type="button">Rückgängig</button>
      <button id="clear-button" type="button">Löschen</button>
      <button id="save-button" type="button">Speichern</button>
      <button id="interpret-button" type="button">Interpretieren</button>
      <button id="approve-button" type="button">Freigeben</button>
      <button id="export-office-button" type="button">Export: Bürotext</button>
      <button id="export-invoice-button" type="button">Export: Rechnungsvorbereitung</button>
      <button id="export-json-button" type="button">Export: JSON</button>
      <label style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem">
        <input type="checkbox" id="use-real-ai" checked />
        Echte Gemini-Interpretation (Server muss laufen: <code>npm run server</code>)
      </label>
    </div>
    <p class="status" id="status"></p>

    <div class="panels">
      <div class="panel">
        <h2>Rohe Notiz (gespeichert)</h2>
        <canvas id="raw-note-preview"></canvas>
      </div>
      <div class="panel">
        <h2>Interner Dokumenteintrag (interpretiert)</h2>
        <div id="interpreted-entry">Noch keine Interpretation.</div>
      </div>
      <div class="panel">
        <h2>Export</h2>
        <textarea id="export-output" readonly rows="8" style="width: 100%; font: inherit"></textarea>
        <div class="controls" style="margin-top: 0.5rem">
          <button id="copy-export-button" type="button">In Zwischenablage kopieren</button>
          <button id="download-json-button" type="button" hidden>JSON herunterladen</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
